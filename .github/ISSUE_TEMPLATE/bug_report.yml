name: Bug report
description: Something in Nautilus does not work the way the README says it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where
      options:
        - Deploying to Vercel
        - Runner in the sandbox
        - Phone app
        - Desktop app
        - Sync between the runner and the PC
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the runner version `/health` shows.
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: The PC's OS, and the phone and browser if it happened on the phone.
      placeholder: Ubuntu 26.04, iPhone 15 with Safari
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The failing output, or the function and sandbox logs from Vercel. Remove URLs and pairing codes first.
      render: text
