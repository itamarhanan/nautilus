[package]
name = "nautilus-desktop"
version = "0.0.0"
license = "GPL-3.0-only"
description = "Nautilus desktop app: run a coding agent from your phone and bring the work home to your PC."
authors = ["Itamar Hanan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-http = "=2.6.1"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-shell = "=2.3.6"
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
